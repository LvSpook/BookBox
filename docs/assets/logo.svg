<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="BookBox logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab4ff"/>
      <stop offset="100%" stop-color="#4f7fe8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#tile)"/>

  <!-- shelf -->
  <rect x="20" y="20" width="56" height="56" rx="6" fill="none" stroke="#6ea0ff" stroke-opacity="0.30" stroke-width="2"/>
  <rect x="20" y="66" width="56" height="10" fill="#6ea0ff" fill-opacity="0.12"/>

  <!-- books -->
  <rect x="27" y="34" width="9" height="32" rx="1.5" fill="#6ea0ff" fill-opacity="0.35"/>
  <rect x="38.5" y="28" width="9" height="38" rx="1.5" fill="#8ab4ff" fill-opacity="0.65"/>
  <rect x="50" y="39" width="9" height="27" rx="1.5" fill="#6ea0ff" fill-opacity="0.45"/>

  <!-- bookmark tab -->
  <path d="M62 24h11v18l-5.5-4.5L62 42z" fill="url(#mark)"/>
  <path d="M62 24h11v18l-5.5-4.5L62 42z" fill="#8ab4ff" fill-opacity="0.55" filter="url(#glow)"/>

  <rect x="1" y="1" width="94" height="94" rx="21" fill="none" stroke="#6ea0ff" stroke-opacity="0.28" stroke-width="2"/>
</svg>
