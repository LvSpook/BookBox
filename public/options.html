<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookBox settings</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* The options page is a full tab, so let the shell use the whole height. */
    body.options-body {
      display: block;
      padding: 24px 16px 48px;
    }
    body.options-body .ext-shell {
      max-height: none;
      max-width: 720px;
      margin: 0 auto;
    }
    body.options-body .ext-main {
      overflow-y: visible;
      max-height: none;
    }
  </style>
</head>
<body class="options-body">
  <script type="module">
    import { renderShell } from './ui.js';
    renderShell();
    await import('./app.js');
  </script>
</body>
</html>
